<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Full-bleed background for Android maskable safe-zone cropping -->
  <rect width="512" height="512" fill="#0b1220"/>
  <defs>
    <linearGradient id="tile" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Rounded brand tile -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#tile)"/>

  <!-- Wi-Fi signal mark (centered in adaptive safe zone) -->
  <path
    d="M152 214 C184 178 218 156 256 156 C294 156 328 178 360 214"
    stroke="#0f172a"
    stroke-width="34"
    stroke-linecap="round"
    fill="none"
    opacity="0.38"
  />
  <path
    d="M188 258 C210 234 232 220 256 220 C280 220 302 234 324 258"
    stroke="#0f172a"
    stroke-width="34"
    stroke-linecap="round"
    fill="none"
    opacity="0.72"
  />
  <circle cx="256" cy="318" r="36" fill="#0f172a"/>
</svg>
