# ─────────────────────────────────────────────────────────────────────────────
#  APPLICATION LAYER — Fastify API + React Web (nginx)
#
#  Start just this layer:   docker compose -f docker-compose.db.yml \
#                                          -f docker-compose.app.yml up -d
#  Or let COMPOSE_FILE load all three files automatically (see .env).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API — Fastify + Prisma ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: asiqurrahman/nexara-api:1.0.0
    container_name: nexara-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-app_user_dev_password}@postgres:5432/${POSTGRES_DB:-radius}?schema=public
      # MD4 (PEAP-MSCHAPv2 NT-hash) is disabled in OpenSSL 3 by default.
      # The legacy provider re-enables it without weakening other crypto.
      NODE_OPTIONS: --openssl-legacy-provider
      RADIUS_CA_CERT_PATH: /etc/raddb/certs-src/ca.pem
      # After NAS add/edit/delete the API runs this so FreeRADIUS reloads clients.
      # Override in .env or Admin → Settings → FreeRADIUS Auto-Reload.
      FREERADIUS_RELOAD_COMMAND: ${FREERADIUS_RELOAD_COMMAND:-docker kill -s HUP nexara-radius}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Optional: mount your own seed override. Do NOT mount a missing host path —
      # Docker will create a directory and break first-boot seed.
      # - ./apps/api/prisma/seed.config.json:/app/apps/api/prisma/seed.config.json:ro
      - ./infra/freeradius/raddb/certs:/etc/raddb/certs-src:ro
      # Needed for FREERADIUS_RELOAD_COMMAND (docker kill -s HUP …).
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Web — React (Vite build) served by nginx ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: asiqurrahman/nexara-web:1.0.0
    container_name: nexara-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8123}:80"
